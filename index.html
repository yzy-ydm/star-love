<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aurora Love</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#02030a;

    font-family:
    "Microsoft YaHei",
    sans-serif;

}



/* =====================
       宇宙底色
===================== */


.space{


    position:fixed;

    inset:0;



    background:


    radial-gradient(
        ellipse at 50% 45%,
        #39205e 0%,
        #17102e 35%,
        #070817 70%,
        #02030a 100%
    );



    z-index:0;


}





/* =====================
       动态星云
===================== */


.nebula{


    position:fixed;


    width:160vw;

    height:160vh;



    left:-30vw;

    top:-30vh;



    background:


    radial-gradient(
        ellipse at 25% 35%,
        rgba(90,150,255,.22),
        transparent 42%
    ),


    radial-gradient(
        ellipse at 75% 60%,
        rgba(255,110,200,.18),
        transparent 40%
    ),


    radial-gradient(
        ellipse at 50% 80%,
        rgba(140,80,255,.15),
        transparent 45%
    );



    filter:blur(55px);



    animation:

    nebulaMove 45s infinite alternate;



    z-index:1;

}




@keyframes nebulaMove{


    from{

        transform:
        rotate(0deg)
        scale(1);

    }


    to{

        transform:
        rotate(20deg)
        scale(1.15);

    }

}





/* =====================
       银河光带
===================== */


.galaxy{


    position:fixed;



    width:150vw;

    height:40vh;



    left:-25vw;

    top:35vh;



    background:


    linear-gradient(

        90deg,

        transparent,

        rgba(120,160,255,.18),

        rgba(255,180,230,.22),

        rgba(120,160,255,.18),

        transparent

    );



    filter:blur(45px);



    transform:

    rotate(-25deg);



    animation:

    galaxyGlow 10s infinite alternate;



    z-index:1;


}





@keyframes galaxyGlow{


    from{

        opacity:.4;

    }


    to{

        opacity:1;

    }


}






/* =====================
       星空Canvas
===================== */


#canvas{


    position:fixed;


    inset:0;


    width:100%;


    height:100%;


    z-index:2;


}








/* =====================
       开始界面
===================== */


.start{


    position:fixed;


    inset:0;



    display:flex;


    justify-content:center;


    align-items:center;



    z-index:50;



    background:
    rgba(0,0,0,.15);


}




.start span{


    color:white;


    font-size:24px;



    letter-spacing:8px;



    text-shadow:


    0 0 15px white,


    0 0 40px #9db8ff;



    animation:

    startPulse 3s infinite;


}




@keyframes startPulse{


    50%{

        opacity:1;

    }


    0%,100%{

        opacity:.55;

    }


}







/* =====================
       爱心光晕
===================== */


.heartGlow{


    position:fixed;


    left:50%;


    top:50%;



    width:480px;


    height:480px;



    transform:
    translate(-50%,-50%);



    background:


    radial-gradient(

        circle,

        rgba(255,120,190,.35),

        transparent 70%

    );



    filter:blur(45px);



    opacity:0;



    z-index:3;



    transition:
    opacity 1.5s;


}




.heartGlow.active{


    opacity:1;


    animation:

    heartPulse 2.5s infinite;


}




@keyframes heartPulse{


    50%{


        transform:

        translate(-50%,-50%)

        scale(1.12);


    }


}








/* =====================
       弹窗
===================== */


.popup{


    position:absolute;



    width:140px;


    height:70px;



    border-radius:10px;



    overflow:hidden;



    z-index:10;




    box-shadow:


    0 0 15px rgba(255,255,255,.25),


    0 8px 25px rgba(0,0,0,.35);



    transform:scale(0);



    animation:

    popupIn .35s forwards;


}




@keyframes popupIn{


    to{

        transform:scale(1);

    }


}





.popupHead{


    height:18px;



    background:

    rgba(255,255,255,.35);



    display:flex;


    justify-content:flex-end;


    align-items:center;



    padding-right:8px;


}




.close{


    width:8px;


    height:8px;



    border-radius:50%;



    background:#ff5f57;



}







.popupText{


    height:52px;



    display:flex;


    align-items:center;


    justify-content:center;



    padding:5px;



    text-align:center;



    font-size:13px;


    font-weight:bold;



    color:#333;


}









/* =====================
       最终文字
===================== */


.final{


    position:fixed;


    left:50%;


    top:50%;



    transform:
    translate(-50%,-50%);



    z-index:40;



    color:white;



    font-size:40px;



    line-height:2;



    letter-spacing:8px;



    text-align:center;



    opacity:0;



    transition:

    opacity 3s;



    text-shadow:


    0 0 15px white,


    0 0 50px #ff9bd0;


}




.final.show{


    opacity:1;


}





@media(max-width:600px){


    .popup{


        width:110px;

        height:58px;


    }


    .popupText{


        height:40px;


        font-size:11px;


    }


    .final{


        font-size:24px;


        letter-spacing:4px;


    }


    .start span{


        font-size:18px;


    }


}



</style>


</head>



<body>


<div class="space"></div>


<div class="nebula"></div>


<div class="galaxy"></div>


<canvas id="canvas"></canvas>



<div class="heartGlow"></div>




<div class="start">

<span>

✨ 点击开启星河 ✨

</span>

</div>



<div class="final">


遇见你

<br>

是银河赠我的礼物


<br>


<span style="font-size:.45em">

愿你永远被温柔以待

</span>


</div>



<script>


const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


let w,h;


function resize(){

    w=canvas.width=window.innerWidth;

    h=canvas.height=window.innerHeight;

}

resize();


window.addEventListener(
"resize",
resize
);



const mobile =
window.innerWidth < 600;



/* =====================
        星空
===================== */


let stars=[];


let starCount =
mobile ? 220 : 500;



for(let i=0;i<starCount;i++){


    stars.push({

        x:Math.random()*w,

        y:Math.random()*h,

        r:Math.random()*1.8+.3,

        alpha:Math.random(),

        speed:
        Math.random()*.015+.005,

        phase:
        Math.random()*6.28

    });


}






/* =====================
        银河粒子
===================== */


let galaxyParticles=[];



for(let i=0;i<220;i++){


    galaxyParticles.push({


        angle:
        Math.random()*Math.PI*2,


        radius:
        Math.random()*500+120,


        speed:
        Math.random()*.0015+.0005,


        size:
        Math.random()*1.5+.5


    });


}







/* =====================
        流星
===================== */


let meteors=[];



function addMeteor(){


    meteors.push({


        x:
        Math.random()*w+200,


        y:
        -100,


        length:
        100+
        Math.random()*100,


        speed:
        7+
        Math.random()*8,


        alpha:1


    });


}



setInterval(()=>{


    if(Math.random()<0.7)

    addMeteor();


},3000);







/* =====================
        绘制星空
===================== */


function drawStars(){



stars.forEach(s=>{


    s.phase+=s.speed;



    let a=
    .35+
    Math.sin(s.phase)*.35;



    ctx.beginPath();


    ctx.arc(

        s.x,

        s.y,

        s.r,

        0,

        Math.PI*2

    );


    ctx.fillStyle=

    `rgba(255,255,255,${a})`;


    ctx.fill();



});


}





function drawGalaxy(){


ctx.save();



ctx.translate(
w/2,
h/2
);



galaxyParticles.forEach(p=>{


    p.angle+=p.speed;



    let x=
    Math.cos(p.angle)
    *
    p.radius;



    let y=
    Math.sin(p.angle)
    *
    p.radius
    *
    .3;



    ctx.beginPath();



    ctx.arc(

        x,

        y,

        p.size,

        0,

        Math.PI*2

    );



    ctx.fillStyle=

    "rgba(210,220,255,.45)";


    ctx.fill();


});



ctx.restore();



}







function drawMeteor(){



for(let i=meteors.length-1;i>=0;i--){



let m=meteors[i];



let gradient=
ctx.createLinearGradient(

m.x,

m.y,

m.x-m.length,

m.y+m.length

);



gradient.addColorStop(

0,

`rgba(255,255,255,${m.alpha})`

);



gradient.addColorStop(

1,

"transparent"

);




ctx.beginPath();



ctx.moveTo(
m.x,
m.y
);



ctx.lineTo(

m.x-m.length,

m.y+m.length

);



ctx.strokeStyle=gradient;


ctx.lineWidth=2;


ctx.stroke();



m.x-=m.speed;


m.y+=m.speed;


m.alpha-=.012;



if(m.alpha<=0)

meteors.splice(i,1);


}



}








/* =====================
       弹窗系统
===================== */


const texts=[


"好好吃饭",

"多喝水",

"早点休息",

"不要熬夜",

"照顾好自己",

"每天开心",

"我想你了",

"永远幸福",

"顺顺利利",

"遇见你真好",

"希望你快乐"


];



const colors=[


"#ffd6e7",

"#d7ecff",

"#fff2bd",

"#d8ffd8",

"#e9dcff"


];



let popups=[];




function createPopup(x,y){



let div=document.createElement("div");



div.className="popup";



div.style.left=x+"px";


div.style.top=y+"px";



div.style.background=

colors[
Math.floor(
Math.random()*colors.length
)
];



div.innerHTML=`

<div class="popupHead">

<div class="close"></div>

</div>


<div class="popupText">

${
texts[
Math.floor(
Math.random()*texts.length
)
]
}

</div>

`;



document.body.appendChild(div);



popups.push(div);



return div;


}






function sleep(ms){

return new Promise(
r=>setTimeout(r,ms)
);

}






/* =====================
        爱心坐标
===================== */


function heartPoints(){


let arr=[];



let count =
mobile ? 75 : 150;



let scale =
Math.min(w,h)/40;



for(let i=0;i<count;i++){


let t=
Math.PI*2*i/count;



let x=
16*
Math.pow(
Math.sin(t),
3
);



let y=

13*Math.cos(t)
-
5*Math.cos(2*t)
-
2*Math.cos(3*t)
-
Math.cos(4*t);



arr.push({

x:
w/2+x*scale-70,


y:
h/2-y*scale-35


});


}


return arr;


}









/* =====================
        爱心出现
===================== */


async function createHeart(){


let points=
heartPoints();



for(let i=0;i<points.length;i++){



createPopup(

points[i].x,

points[i].y

);



await sleep(22);



}



document
.querySelector(".heartGlow")
.classList
.add("active");



await sleep(2500);



removeHeart();



}








/* =====================
        爱心消失
===================== */


async function removeHeart(){



for(
let i=popups.length-1;
i>=0;
i--
){


let p=
popups[i];



p.style.transition=
".35s";



p.style.opacity="0";



p.style.transform=

"scale(.1) rotate(180deg)";



await sleep(25);



setTimeout(()=>{

p.remove();

},350);



}



popups=[];



await sleep(800);



fullScreen();


}








/* =====================
        全屏爆发
===================== */


async function fullScreen(){



let count =
mobile ? 150 : 320;



for(let i=0;i<count;i++){



let x=
Math.random()*(w-140);



let y=
Math.random()*(h-70);



createPopup(
x,
y
);



await sleep(12);



}



await sleep(2500);



document
.querySelector(".final")
.classList
.add("show");



}








/* =====================
        动画循环
===================== */


function animate(){



ctx.clearRect(
0,
0,
w,
h
);



drawGalaxy();


drawStars();


drawMeteor();



requestAnimationFrame(
animate
);



}


animate();







/* =====================
        开始
===================== */


document
.querySelector(".start")
.onclick=function(){



this.style.opacity=0;



setTimeout(()=>{


this.style.display="none";


createHeart();



},800);



};


</script>


</body>

</html>
