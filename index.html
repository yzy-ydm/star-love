<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>给你的惊喜</title>


<style>

/* =========================
   基础
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#05020d;

    font-family:
    "Microsoft YaHei",
    sans-serif;

}


/* =========================
   深空背景
========================= */

.space-bg{

    position:fixed;

    inset:0;

    background:

    radial-gradient(
        ellipse at center,
        #241044 0%,
        #100722 40%,
        #05020d 75%,
        #020106 100%
    );

    z-index:0;

}


/* 银河云层 */

.nebula{


    position:fixed;


    width:150%;
    height:150%;


    left:-25%;
    top:-25%;



    background:


    radial-gradient(
        ellipse at 35% 45%,
        rgba(90,120,255,.18),
        transparent 45%
    ),


    radial-gradient(
        ellipse at 70% 60%,
        rgba(255,120,190,.12),
        transparent 40%
    ),


    radial-gradient(
        ellipse at 50% 20%,
        rgba(120,180,255,.10),
        transparent 35%
    );



    filter:blur(50px);


    animation:

    nebulaMove 30s infinite alternate;



    z-index:1;

}



@keyframes nebulaMove{


    from{

        transform:
        rotate(0deg)
        scale(1);

    }


    to{

        transform:
        rotate(15deg)
        scale(1.15);

    }


}





/* =========================
   星空Canvas
========================= */

#starCanvas{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    z-index:2;

}



/* =========================
   爱心光晕
========================= */


.heart-glow{


    position:fixed;


    left:50%;

    top:50%;


    width:500px;

    height:500px;


    transform:
    translate(-50%,-50%);



    background:

    radial-gradient(
        circle,
        rgba(255,90,170,.22),
        transparent 70%
    );



    filter:blur(50px);



    opacity:0;



    z-index:3;



    transition:
    opacity 2s;


}



.heart-glow.active{

    opacity:1;

    animation:

    heartbeat 3s infinite;

}



@keyframes heartbeat{


    0%,100%{

        transform:
        translate(-50%,-50%)
        scale(1);

    }


    50%{

        transform:
        translate(-50%,-50%)
        scale(1.15);

    }


}





/* =========================
   开始按钮
========================= */


.start-screen{


    position:fixed;


    inset:0;


    display:flex;

    justify-content:center;

    align-items:center;



    z-index:50;



    background:
    rgba(0,0,0,.25);



}



.start-text{


    color:white;


    font-size:22px;


    letter-spacing:6px;


    text-shadow:

    0 0 10px white,
    0 0 30px #8da8ff;



    animation:

    breathe 3s infinite;



}



@keyframes breathe{


    0%,100%{

        opacity:.6;

    }


    50%{

        opacity:1;

    }

}



/* =========================
   小窗口
========================= */


.popup{


    position:absolute;


    width:140px;


    height:70px;



    border-radius:8px;



    overflow:hidden;



    z-index:10;



    box-shadow:


    0 0 18px rgba(255,255,255,.25),


    0 8px 25px rgba(0,0,0,.55);



    animation:

    popupIn .35s
    cubic-bezier(.2,1.5,.4,1)
    forwards;



    transform:scale(0);



}



@keyframes popupIn{


    to{

        transform:scale(1);

    }


}



.title-bar{


    height:18px;


    background:

    rgba(255,255,255,.35);



    display:flex;


    justify-content:flex-end;


    align-items:center;



    padding-right:8px;



}



.close-btn{


    width:8px;


    height:8px;


    background:#ff5f57;


    border-radius:50%;



    box-shadow:

    0 0 8px #ff5f57;



}



.popup-content{


    height:

    calc(100% - 18px);



    display:flex;


    justify-content:center;


    align-items:center;



    text-align:center;



    font-size:13px;


    font-weight:bold;



    color:#333;



    padding:5px;



}



/* =========================
   最终文字
========================= */


.final-text{


    position:fixed;


    left:50%;


    top:50%;



    transform:
    translate(-50%,-50%);



    z-index:40;



    color:white;



    font-size:38px;


    line-height:2;



    letter-spacing:8px;



    text-align:center;



    opacity:0;



    text-shadow:


    0 0 10px white,

    0 0 30px #ff8fc8,

    0 0 60px #8da8ff;



    transition:

    opacity 3s;



}



.final-text.show{

    opacity:1;

}





/* =========================
   手机适配
========================= */


@media(max-width:600px){


.popup{

    width:115px;

    height:58px;

}



.popup-content{

    font-size:11px;

}



.final-text{

    font-size:25px;

    letter-spacing:4px;

}



.start-text{

    font-size:17px;

}



}


</style>


</head>



<body>


<div class="space-bg"></div>


<div class="nebula"></div>


<canvas id="starCanvas"></canvas>


<div class="heart-glow"></div>



<div class="start-screen">

<div class="start-text">

✨ 点击开启星河 ✨

</div>

</div>



<div class="final-text">

遇见你<br>

是银河赠我的礼物

</div>



<script>


const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");


let width;
let height;


let stars = [];
let meteors = [];

let popupList = [];


let isMobile =
window.innerWidth < 600;



function resizeCanvas(){

    width =
    canvas.width =
    window.innerWidth;


    height =
    canvas.height =
    window.innerHeight;

}


resizeCanvas();


window.addEventListener(
"resize",
resizeCanvas
);





/* =========================
        星空系统
========================= */


const starCount =
isMobile ? 180 : 450;



for(let i=0;i<starCount;i++){


    stars.push({

        x:
        Math.random()*width,


        y:
        Math.random()*height,


        r:
        Math.random()*1.5+0.3,


        alpha:
        Math.random(),


        speed:
        Math.random()*0.02+0.005,


        offset:
        Math.random()*Math.PI*2


    });


}





function drawStars(){


    stars.forEach(star=>{


        star.offset += star.speed;



        let alpha =
        0.35 +
        Math.sin(star.offset)
        *
        0.35;



        ctx.beginPath();



        ctx.arc(

            star.x,

            star.y,

            star.r,

            0,

            Math.PI*2

        );



        ctx.fillStyle =
        `rgba(255,255,255,${alpha})`;



        ctx.fill();



    });


}






/* =========================
       银河系统
========================= */


let galaxyAngle = 0;



function drawGalaxy(){


    galaxyAngle+=0.0005;


    ctx.save();


    ctx.translate(
        width/2,
        height/2
    );


    ctx.rotate(
        galaxyAngle
    );



    for(
    let i=0;
    i<300;
    i++
    ){


        let distance =
        Math.random()
        *
        Math.max(width,height);



        let angle =
        Math.random()
        *
        Math.PI*2;



        let x =
        Math.cos(angle)
        *
        distance;



        let y =
        Math.sin(angle)
        *
        distance
        *
        0.25;



        ctx.beginPath();



        ctx.arc(

            x,

            y,

            Math.random()*1.5,

            0,

            Math.PI*2

        );



        ctx.fillStyle =
        "rgba(170,190,255,.15)";



        ctx.fill();


    }



    ctx.restore();


}






/* =========================
        流星
========================= */


function createMeteor(){


    meteors.push({


        x:
        Math.random()*width,


        y:
        -50,


        length:
        60+
        Math.random()*80,


        speed:
        5+
        Math.random()*6,


        alpha:1


    });


}



setInterval(()=>{


    if(Math.random()<0.8){

        createMeteor();

    }


},2500);







function drawMeteors(){


    for(
    let i=meteors.length-1;
    i>=0;
    i--
    ){


        let m =
        meteors[i];



        let gradient =
        ctx.createLinearGradient(

            m.x,

            m.y,

            m.x-m.length,

            m.y+m.length

        );



        gradient.addColorStop(

            0,

            `rgba(255,255,255,${m.alpha})`

        );



        gradient.addColorStop(

            1,

            "rgba(255,255,255,0)"

        );




        ctx.beginPath();



        ctx.moveTo(
            m.x,
            m.y
        );



        ctx.lineTo(

            m.x-m.length,

            m.y+m.length

        );



        ctx.strokeStyle =
        gradient;



        ctx.lineWidth=2;



        ctx.stroke();




        m.x-=m.speed;


        m.y+=m.speed;



        m.alpha-=0.015;




        if(m.alpha<=0){

            meteors.splice(i,1);

        }


    }


}







/* =========================
       窗口文字
========================= */


const messages=[


"好好吃饭",

"多喝水",

"早点休息",

"不要熬夜",

"保持开心",

"照顾好自己",

"我想你了",

"每天快乐",

"顺顺利利",

"永远爱你",

"希望你幸福",

"遇见你真好"


];



const colors=[

"#ffd6e7",

"#d7f5ff",

"#fff2b8",

"#d9ffd9",

"#e8dcff",

"#ffd8c4"


];






function createPopup(x,y){


    let div =
    document.createElement("div");



    div.className="popup";



    let color =
    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];



    let text =
    messages[
    Math.floor(
    Math.random()*messages.length
    )
    ];



    div.style.left =
    x+"px";


    div.style.top =
    y+"px";



    div.style.background =
    color;



    div.innerHTML = `


    <div class="title-bar">

        <div class="close-btn"></div>

    </div>


    <div class="popup-content">

        ${text}

    </div>


    `;



    document.body.appendChild(div);



    popupList.push(div);



    return div;


}







/* =========================
       爱心坐标
========================= */


function heartPosition(
t,
scale
){


return {


x:
16*
Math.pow(
Math.sin(t),
3
)
*
scale,


y:
(
13*Math.cos(t)
-
5*Math.cos(2*t)
-
2*Math.cos(3*t)
-
Math.cos(4*t)
)
*
scale



};


}






/* =========================
       爱心生成
========================= */


async function createHeart(){


let count =
isMobile ? 65 : 110;



let scale =
Math.min(
width,
height
)
/38;



for(let i=0;i<count;i++){


    let t =
    Math.PI*2*i/count;



    let p =
    heartPosition(
        t,
        scale
    );



    let startX =
    Math.random()*width;


    let startY =
    Math.random()*height;




    let popup =
    createPopup(
        startX,
        startY
    );



    let targetX =
    width/2+p.x-70;


    let targetY =
    height/2-p.y-35;




    setTimeout(()=>{


        popup.style.transition =
        "all 1.5s cubic-bezier(.2,1.5,.3,1)";


        popup.style.left =
        targetX+"px";


        popup.style.top =
        targetY+"px";



    },i*35);



    await sleep(35);



}



document
.querySelector(".heart-glow")
.classList.add("active");

}




function sleep(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}






/* =========================
       主动画
========================= */


function render(){


ctx.clearRect(
0,
0,
width,
height
);



drawGalaxy();

drawStars();

drawMeteors();



requestAnimationFrame(
render
);


}



render();
/* =========================
        第三阶段
        爱心完成后的剧情
========================= */


async function startFinalAnimation(){



    await sleep(5000);



    // 爱心呼吸结束

    document
    .querySelector(".heart-glow")
    .classList.remove("active");



    // 开始消散

    await dissolveHeart();



    await sleep(1000);



    // 全屏文字雨

    await createSkyWindows();



    await sleep(3000);



    showFinalText();



}





/* =========================
        爱心消散
========================= */


async function dissolveHeart(){


    let list =
    [...popupList];



    for(
    let i=list.length-1;
    i>=0;
    i--
    ){


        let popup =
        list[i];



        popup.style.transition =
        "all .5s ease";



        popup.style.transform =
        "scale(.1) rotate(180deg)";



        popup.style.opacity =
        "0";



        setTimeout(()=>{


            popup.remove();


        },500);



        await sleep(30);


    }



    popupList=[];



}





/* =========================
       全屏窗口星雨
========================= */


async function createSkyWindows(){


    let count =
    isMobile ? 90 : 180;



    for(let i=0;i<count;i++){



        let x =
        Math.random()
        *
        (width-140);



        let y =
        Math.random()
        *
        (height-70);



        let popup =
        createPopup(
            x,
            y
        );



        popup.style.opacity="0";



        setTimeout(()=>{


            popup.style.transition =
            "opacity .8s, transform .8s";


            popup.style.opacity="1";

            popup.style.transform =
            "scale(1)";


        },50);



        await sleep(40);


    }



}





/* =========================
       最终文字
========================= */


function showFinalText(){


    let text =
    document.querySelector(
    ".final-text"
    );



    text.innerHTML=`

    <div>

    遇见你

    <br>

    是银河赠我的礼物

    <br>

    <span style="
    font-size:.45em;
    letter-spacing:5px;
    ">

    愿你永远被温柔以待

    </span>

    </div>

    `;



    text.classList.add(
    "show"
    );



}






/* =========================
       自动开始最终阶段
========================= */


const oldCreateHeart =
createHeart;



createHeart = async function(){


    await oldCreateHeart();



    startFinalAnimation();


};




/* 开始 */


document
.querySelector(".start-screen")
.onclick=()=>{


document
.querySelector(".start-screen")
.style.opacity=0;



setTimeout(()=>{


document
.querySelector(".start-screen")
.style.display="none";


createHeart();


},1200);



};


</script>


</body>

</html>
