<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>给你的惊喜</title>


<style>


/* ===============================
      基础设置
================================ */


*{

margin:0;
padding:0;
box-sizing:border-box;

}


html,body{

width:100%;
height:100%;

overflow:hidden;

background:#02010a;

font-family:
"Microsoft YaHei",
sans-serif;

}



/* ===============================
      深空背景
================================ */


.space{

position:fixed;

inset:0;

background:

radial-gradient(
ellipse at center,
#241044 0%,
#100522 35%,
#05020d 70%,
#020108 100%
);


z-index:0;


}



/* 银河云雾 */

.galaxy{


position:fixed;

width:140%;
height:140%;

left:-20%;
top:-20%;


background:


radial-gradient(
ellipse at 30% 40%,
rgba(120,80,255,.18),
transparent 45%
),


radial-gradient(
ellipse at 70% 60%,
rgba(255,100,180,.15),
transparent 45%
),


radial-gradient(
ellipse at 50% 20%,
rgba(100,180,255,.12),
transparent 40%
);



filter:
blur(40px);



animation:

galaxyMove 25s infinite alternate;


z-index:1;


}



@keyframes galaxyMove{


0%{

transform:
rotate(0deg)
scale(1);

}


100%{


transform:

rotate(12deg)
scale(1.15);


}



}



/* ===============================
        星空 Canvas
================================ */


#starCanvas{


position:fixed;

inset:0;

z-index:2;


}



/* ===============================
        爱心中心光
================================ */


.heartGlow{


position:fixed;


left:50%;

top:50%;


width:500px;

height:500px;



transform:

translate(-50%,-50%);



background:


radial-gradient(

circle,

rgba(255,80,160,.18),

transparent 70%

);



filter:

blur(50px);



opacity:0;



z-index:3;



transition:

opacity 2s;


}



.heartGlow.show{


opacity:1;


animation:

heartbeat 3s infinite;


}



@keyframes heartbeat{


0%,100%{


transform:

translate(-50%,-50%)
scale(1);


}


50%{


transform:

translate(-50%,-50%)
scale(1.15);


}



}



/* ===============================
        小窗口
================================ */


.popup{


position:absolute;


width:140px;

height:70px;



border-radius:10px;



overflow:hidden;



z-index:10;



box-shadow:


0 0 20px
rgba(255,255,255,.18),


0 10px 30px
rgba(0,0,0,.55);



animation:


popupShow .35s
cubic-bezier(.2,1.5,.4,1)
forwards;



transform:

scale(0);



transition:

opacity .35s,
transform .35s;



}



@keyframes popupShow{


to{


transform:
scale(1);


}


}




/* 标题栏 */


.title-bar{


height:18px;


background:

rgba(255,255,255,.32);



display:flex;

align-items:center;

justify-content:flex-end;



padding-right:8px;



}




.close-btn{


width:8px;

height:8px;


background:#ff5f57;


border-radius:50%;



box-shadow:

0 0 8px
#ff5f57;



}




.content{


height:

calc(100% - 18px);



display:flex;


align-items:center;


justify-content:center;



font-size:13px;


font-weight:bold;



color:#333;



text-align:center;


padding:5px;



text-shadow:

0 1px rgba(255,255,255,.7);



}



/* ===============================
       最终文字
================================ */


.finalText{


position:fixed;


left:50%;

top:50%;


transform:

translate(-50%,-50%);



font-size:38px;


letter-spacing:8px;



color:white;



text-shadow:


0 0 10px white,

0 0 30px #ff80bb,

0 0 60px #ff80bb;



opacity:0;



z-index:30;



transition:

opacity 3s;



}



.finalText.show{


opacity:1;


}




</style>


</head>



<body>



<div class="space"></div>


<div class="galaxy"></div>


<div class="heartGlow"></div>


<canvas id="starCanvas"></canvas>



<div class="finalText">

遇见你，是银河赠我的礼物

</div>



<script>


/* ==================================
       星空系统
================================== */


const canvas =
document.getElementById(
"starCanvas"
);


const ctx =
canvas.getContext("2d");



let width;

let height;



let stars=[];

let meteors=[];



function resize(){


width=
canvas.width=
window.innerWidth;



height=
canvas.height=
window.innerHeight;



stars=[];



// 第一层星空

for(let i=0;i<180;i++){


stars.push({


x:
Math.random()*width,


y:
Math.random()*height,


r:
Math.random()*1.2,


speed:
Math.random()*0.03,


phase:
Math.random()*Math.PI*2


});


}



// 第二层亮星

for(let i=0;i<50;i++){


stars.push({


x:
Math.random()*width,


y:
Math.random()*height,


r:
1+Math.random()*2,


speed:
Math.random()*0.05,


phase:
Math.random()*6


});


}



}



window.addEventListener(
"resize",
resize
);


resize();



function drawStars(){


ctx.clearRect(
0,
0,
width,
height
);



stars.forEach(s=>{


s.phase+=s.speed;



let alpha=

0.35+
Math.sin(s.phase)*0.4;



ctx.beginPath();


ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);



ctx.fillStyle=

`rgba(255,255,255,${alpha})`;



ctx.fill();



});





/* 流星 */

if(Math.random()<0.015){


meteors.push({


x:
Math.random()*width*1.2,


y:
-50,


length:
60+
Math.random()*80,


speed:
8+
Math.random()*8,


alpha:1


});


}




meteors.forEach(
(m,i)=>{


ctx.beginPath();



let gradient=

ctx.createLinearGradient(

m.x,

m.y,

m.x-m.length,

m.y+m.length

);



gradient.addColorStop(

0,

`rgba(255,255,255,${m.alpha})`

);



gradient.addColorStop(

1,

"rgba(255,255,255,0)"

);



ctx.strokeStyle=
gradient;



ctx.lineWidth=2;



ctx.moveTo(
m.x,
m.y
);



ctx.lineTo(

m.x-m.length,

m.y+m.length

);



ctx.stroke();



m.x-=m.speed;

m.y+=m.speed;

m.alpha-=0.015;



if(m.alpha<=0)

meteors.splice(i,1);



});




requestAnimationFrame(
drawStars
);


}



drawStars();
/* =====================================
        告白窗口系统
===================================== */



const messages = [

"好好吃饭",

"早点休息",

"别熬夜",

"记得开心",

"照顾好自己",

"我想你了",

"希望你每天快乐",

"愿你平安顺利",

"一直保持笑容",

"未来也要幸福",

"谢谢你出现",

"永远支持你"

];



const colors=[

"#ffb6c1",

"#87cefa",

"#98fb98",

"#fffacd",

"#e6e6fa",

"#ffd7ba",

"#ffc0cb",

"#afeeee"

];





function createWindow(x,y){


let div=document.createElement("div");


div.className="popup";



div.style.left=x+"px";

div.style.top=y+"px";



div.style.backgroundColor=

colors[
Math.floor(
Math.random()*colors.length
)
];



div.innerHTML=`

<div class="title-bar">

<div class="close-btn"></div>

</div>


<div class="content">

${
messages[
Math.floor(
Math.random()*messages.length
)
]
}

</div>

`;



document.body.appendChild(div);



return div;


}







/* =====================================
          爱心算法
===================================== */


function getHeartPoints(
count,
scale
){



let result=[];



let cx=
window.innerWidth/2;


let cy=
window.innerHeight/2;



for(let i=0;i<count;i++){


let t=
Math.PI*2*i/count;



let x=
16*
Math.pow(
Math.sin(t),
3
);



let y=
13*
Math.cos(t)
-
5*
Math.cos(2*t)
-
2*
Math.cos(3*t)
-
Math.cos(4*t);




result.push({


x:

cx+x*scale-70,


y:

cy-y*scale-35


});



}



return result;



}





const wait =
ms =>
new Promise(
resolve=>setTimeout(resolve,ms)
);







/* =====================================
          星尘粒子
===================================== */


function createSpark(x,y){


let star=document.createElement("div");


star.style.position="fixed";

star.style.left=x+"px";

star.style.top=y+"px";


star.style.width="3px";

star.style.height="3px";


star.style.borderRadius="50%";


star.style.background="white";


star.style.boxShadow=

"0 0 15px white";



star.style.zIndex=5;



document.body.appendChild(star);



let dx=
(Math.random()-.5)*120;


let dy=
(Math.random()-.5)*120;



star.animate([

{

transform:"translate(0,0)",

opacity:1

},


{

transform:
`translate(${dx}px,${dy}px)`,

opacity:0

}


],{


duration:
1200,

easing:"ease-out"


});



setTimeout(()=>{

star.remove();

},1200);



}








/* =====================================
          主动画
===================================== */


async function startLove(){



await wait(800);



let glow=
document.querySelector(
".heartGlow"
);


glow.classList.add(
"show"
);





let scale=

Math.min(
window.innerWidth,
window.innerHeight
)
/42;



let points=

getHeartPoints(
90,
scale
);



let windows=[];



/*
    爱心慢慢出现
*/


for(let p of points){



let w=
createWindow(
p.x,
p.y
);



windows.push(w);



await wait(35);



}




/*

爱心形成

*/


await wait(1000);




/*
    爱心呼吸
*/


windows.forEach(
w=>{


w.animate([


{
transform:"scale(1)"
},


{
transform:"scale(1.08)"
},


{
transform:"scale(1)"
}


],{


duration:2500,

iterations:2


});


}

);





await wait(3000);





/*
    爱心消散
*/


for(
let i=windows.length-1;
i>=0;
i--
){



let w=
windows[i];



let rect=
w.getBoundingClientRect();



createSpark(
rect.left+70,
rect.top+35
);



w.style.opacity=0;



w.style.transform=

"scale(.2)";



setTimeout(()=>{

w.remove();

},400);



await wait(30);



}





await wait(1500);





/*
    全屏思念爆发
*/



let total=380;



for(
let i=0;
i<total;
i++
){



let x=
Math.random()
*
(window.innerWidth-140);



let y=
Math.random()
*
(window.innerHeight-70);




let w=
createWindow(
x,
y
);



/*
窗口进入动画

*/

w.animate([


{


transform:

`translate(
${Math.random()*200-100}px,
${Math.random()*200-100}px
)
scale(.3)`

},



{


transform:

"translate(0,0) scale(1)"

}



],{


duration:800,

easing:
"cubic-bezier(.2,1.5,.4,1)"

});





await wait(12);



}




await wait(2500);





/*
最终文字

*/


document
.querySelector(".finalText")
.classList
.add("show");



}





window.onload=()=>{


startLove();


};


</script>
